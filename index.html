<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>SHEILA ON7 POLIPONI.ID</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f0f0f;
      color: white;
    }

    .container {
      max-width: 430px;
      margin: auto;
      min-height: 100vh;
      background: #171717;
      overflow: hidden;
    }

    .banner img {
      width: 100%;
      display: block;
    }

    .content {
      padding: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
      color: #ffd700;
    }

    .ticket-box {
      background: #242424;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 20px;
      border: 2px solid #ffd700;
    }

    .ticket-box h3 {
      margin-bottom: 12px;
      color: #ffd700;
    }

    .ticket {
      background: #111;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }

    .ticket-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .price {
      color: #00ff99;
      font-size: 18px;
      font-weight: bold;
    }

    .limit {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2a2a2a;
      color: white;
      font-size: 15px;
    }

    .total-box {
      background: #111;
      border: 2px dashed #ffd700;
      padding: 15px;
      border-radius: 14px;
      margin-top: 20px;
      text-align: center;
    }

    .total-box h2 {
      color: #00ff99;
      margin-top: 8px;
    }

    .qris {
      margin-top: 20px;
      text-align: center;
    }

    .qris img {
      width: 100%;
      border-radius: 20px;
      border: 3px solid #ffd700;
      background: white;
      padding: 10px;
    }

    .upload-box {
      margin-top: 20px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #ffd700, #ffb700);
      color: black;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.02);
    }

    .loading {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 9999;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 8px solid #333;
      border-top: 8px solid #ffd700;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .loading p {
      margin-top: 20px;
      font-size: 18px;
      color: white;
    }

    .success {
      display: none;
      margin-top: 20px;
      background: #003b22;
      border: 1px solid #00ff99;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      color: #00ff99;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- BANNER EVENT -->
  <div class="banner">
    <img src="GANTI-DENGAN-GAMBAR-EVENT-ANDA.jpg" alt="Banner Event">
  </div>

  <div class="content">

    <div class="title">PEMBELIAN TIKET EVENT</div>

    <div class="ticket-box">
      <h3>DAFTAR TIKET</h3>

      <div class="ticket">
        <div class="ticket-name">PREMIUM</div>
        <div class="price">Rp. 400.000</div>
      </div>

      <div class="ticket">
        <div class="ticket-name">FAST TRACK</div>
        <div class="price">Rp. 600.000</div>
      </div>

      <div class="limit">
        Maksimal pembelian tiket: <b>10 tiket</b>
      </div>
    </div>

    <label>Nama Lengkap</label>
    <input type="text" id="nama" placeholder="Masukan nama lengkap">

    <label>E-mail</label>
    <input type="email" id="email" placeholder="Masukan e-mail aktif">

    <label>Pilih Tiket</label>
    <select id="ticketType" onchange="hitungTotal()">
      <option value="400000">PREMIUM - Rp. 400.000</option>
      <option value="600000">FAST TRACK - Rp. 600.000</option>
    </select>

    <label>Jumlah Tiket</label>
    <input type="number" id="jumlah" min="1" max="10" value="1" onchange="hitungTotal()">

    <div class="total-box">
      TOTAL PEMBAYARAN
      <h2 id="totalHarga">Rp. 400.000</h2>
    </div>

    <!-- QRIS -->
    <div class="qris">
      <h3 style="margin-bottom:10px;color:#ffd700;">SCAN QRIS PEMBAYARAN</h3>
      <img src="GANTI-DENGAN-QRIS-ANDA.png" alt="QRIS">
    </div>

    <!-- UPLOAD -->
    <div class="upload-box">
      <label>Upload Bukti Pembayaran</label>
      <input type="file" id="bukti">
    </div>

    <button class="btn" onclick="prosesPembelian()">
      BELI SEKARANG
    </button>

    <div class="success" id="successBox">
      Pembayaran berhasil diverifikasi!<br><br>
      E-mail konfirmasi & E-Ticket berhasil dikirim.
    </div>

  </div>
</div>

<!-- LOADING -->
<div class="loading" id="loadingScreen">
  <div class="spinner"></div>
  <p>Memproses Pembelian...</p>
</div>

<script>

function formatRupiah(angka) {
  return 'Rp. ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function hitungTotal() {
  let harga = parseInt(document.getElementById('ticketType').value);
  let jumlah = parseInt(document.getElementById('jumlah').value);

  if(jumlah > 10) {
    alert('Maksimal pembelian hanya 10 tiket');
    document.getElementById('jumlah').value = 10;
    jumlah = 10;
  }

  let total = harga * jumlah;

  document.getElementById('totalHarga').innerText = formatRupiah(total);
}

function prosesPembelian() {

  let nama = document.getElementById('nama').value;
  let email = document.getElementById('email').value;

  if(nama === '' || email === '') {
    alert('Lengkapi data terlebih dahulu');
    return;
  }

  document.getElementById('loadingScreen').style.display = 'flex';

  setTimeout(() => {

    document.getElementById('loadingScreen').style.display = 'none';

    document.getElementById('successBox').style.display = 'block';

    // SIMULASI EMAIL KONFIRMASI
    console.log('E-mail konfirmasi terkirim ke:', email);

    // REDIRECT KE HALAMAN UTAMA
    setTimeout(() => {
      window.location.href = 'https://tiket.poliponi.online';
    }, 5000);

  }, 4000);
}

hitungTotal();

</script>

</body>
</html>
